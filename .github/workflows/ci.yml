name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx quasar build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build & start stack
        # Use only the base compose so the production (nginx) image is built,
        # not the local dev override which runs the Vite dev server on :9000.
        env:
          # Auth cookie must not be Secure so the browser keeps it over http://localhost:8080.
          COOKIE_SECURE: "false"
          # Run the e2e suite against the English UI (the tests assert English strings).
          DEFAULT_LOCALE: "en"
        run: docker compose -f docker-compose.yml up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/healthz >/dev/null; then
              echo "API is up"; break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8080/api/v1/readyz
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
