<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WishDeck Add Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; max-width: 400px; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; }
    #status { margin-top: 1rem; color: green; }
  </style>
</head>
<body>
  <h2>WishDeck Add Settings</h2>
  <label for="host">WishDeck host URL</label>
  <input id="host" type="url" placeholder="http://localhost:8080" />
  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
